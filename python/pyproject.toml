[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "x402-openai"
version = "0.1.0"
description = "OpenAI-compatible Responses client and provider gateway with x402 USDC payments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "x402 OpenAI contributors" }]
keywords = ["openai", "x402", "usdc", "base", "payments"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "eth-account>=0.13,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
  "x402[extensions,httpx,requests]>=2.19,<3",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<2",
  "openai>=2,<4",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<9",
  "uvicorn>=0.30,<1",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.urls]
Documentation = "https://github.com/infer402/x402-openai#readme"
Repository = "https://github.com/infer402/x402-openai"
Issues = "https://github.com/infer402/x402-openai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_openai"]

[tool.hatch.build.targets.sdist]
include = ["src/x402_openai", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["x402_openai"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["x402.*", "redis.*", "eth_utils.*"]
ignore_missing_imports = true
